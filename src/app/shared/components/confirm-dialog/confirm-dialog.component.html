<h2 mat-dialog-title>
  Confirm
</h2>

<div mat-dialog-content>

  {{ data.message }}

</div>

<div mat-dialog-actions>

  <button mat-button style="&:hover { color: white; }" [mat-dialog-close]="false">
    Cancel
  </button>

  <button mat-raised-button color="warn" [mat-dialog-close]="true">
    Delete
  </button>

</div>
