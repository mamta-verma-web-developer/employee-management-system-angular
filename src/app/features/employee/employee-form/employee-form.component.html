<div class="form-container">

  <h2 class="theme-btn">
    {{ employeeId ? 'Edit Employee' : 'Add Employee' }}
  </h2>

  <form
    [formGroup]="employeeForm"
    (ngSubmit)="onSubmit()">

    <!-- Name -->

    <div class="form-group">

      <label>Employee Name</label>

      <input
        type="text"
        placeholder="Enter employee name"
        formControlName="name">

      <div
        class="error"
        *ngIf="
          employeeForm.get('name')?.touched &&
          employeeForm.get('name')?.invalid
        ">

        Name is required

      </div>

    </div>

    <!-- Email -->

    <div class="form-group">

      <label>Email Address</label>

      <input
        type="email"
        placeholder="Enter email"
        formControlName="email">

      <div
        class="error"
        *ngIf="
          employeeForm.get('email')?.touched &&
          employeeForm.get('email')?.invalid
        ">

        Enter valid email

      </div>

    </div>

    <!-- Department -->

    <div class="form-group">

      <label>Department</label>

      <input
        type="text"
        placeholder="Enter department"
        formControlName="department">

    </div>

    <!-- Status -->

    <div class="form-group">

      <label>Status</label>

      <select formControlName="status">

        <option value="">
          Select Status
        </option>

        <option value="Active">
          Active
        </option>

        <option value="Inactive">
          Inactive
        </option>

      </select>

    </div>

    <!-- Role -->
 
    <div class="form-group">

      <label>Role</label>

      <select formControlName="role">

        <option value="">
          Select Role
        </option>

        <option value="Admin">
          Admin
        </option>

        <option value="User">
          User
        </option>

      </select>

    </div>

    <!-- Image Upload -->

    <div class="form-group">

      <label>Profile Image</label>

      <input
        type="file"
        (change)="onFileChange($event)">

    </div>

    <!-- Preview -->

    <img
      *ngIf="previewUrl"
      [src]="previewUrl"
      class="preview-image">

    <!-- Button -->

    <button type="submit">

      {{ employeeId ? 'Update Employee' : 'Save Employee' }}

    </button>

  </form>

</div>
